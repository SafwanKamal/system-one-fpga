# RC1.1: lossless speculative decoding (bundle /var/lib/sysone/rc1-spec-v1).
# Remove this drop-in, then daemon-reload and restart, to return to plain RC1.
[Unit]
Description=RC1 persistent FPGA inference with sealed weights, prefix reuse and lossless speculative decoding

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -u /var/lib/sysone/rc1-spec-v1/spec_service.py serve --package /var/lib/sysone/hardware-consolidated-rc1-20261108 --socket /run/sysone-rc1/api.sock --ready /run/sysone-rc1/ready.json --speculate adaptive --gate-threshold 0.25
