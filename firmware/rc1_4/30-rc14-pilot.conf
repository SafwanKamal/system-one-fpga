# Volatile drop-in for the RC1.4 board pilot. RC1.3 resumes after reboot.
[Unit]
Description=RC1.4 pilot (v9i, modelled dual-port P=2 drafter costs)

[Service]
TimeoutStartSec=150
ExecStartPre=
ExecStartPre=/usr/bin/python3 /var/lib/sysone/rc1-4-pilot/rc14_image.py up
ExecStart=
ExecStart=/usr/bin/python3 -u /var/lib/sysone/rc1-4-pilot/spec_service_rc14.py serve --package /var/lib/sysone/rc1-4-pilot/package --socket /run/sysone-rc1/api.sock --ready /run/sysone-rc1/ready.json
ExecStopPost=
ExecStopPost=/usr/bin/python3 /var/lib/sysone/rc1-4-pilot/rc14_image.py down
