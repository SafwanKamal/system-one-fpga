# RC1.3: v9h image + batched-head verification + cost-aware drafter (bundle /var/lib/sysone/rc1-3-v1).
# Layered on RC1.1 (10-speculation.conf). Remove this drop-in, daemon-reload, stop, run
# rc13_image.py down, start: back to RC1.1 on v9e (install_rc13.py disable does exactly this).
[Unit]
Description=RC1.3 persistent FPGA inference (v9h, batched verification, cost-aware lossless speculation)

[Service]
TimeoutStartSec=150
ExecStartPre=/usr/bin/python3 /var/lib/sysone/rc1-3-v1/rc13_image.py up
ExecStart=
ExecStart=/usr/bin/python3 -u /var/lib/sysone/rc1-3-v1/spec_service_rc13.py serve --package /var/lib/sysone/rc1-3-v1/package --socket /run/sysone-rc1/api.sock --ready /run/sysone-rc1/ready.json
ExecStopPost=/usr/bin/python3 /var/lib/sysone/rc1-3-v1/rc13_image.py down
